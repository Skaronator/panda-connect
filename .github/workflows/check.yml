name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            server/go.sum
      - run: go test -race -count=1 ./...
      - run: go test -race -count=1 ./...
        working-directory: server
      - run: go vet ./...
      - run: go vet ./...
        working-directory: server
