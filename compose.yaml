name: panda-connect
services:
  prusa-connect:
    image: panda-connect-prusa-connect:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:${PANDA_CONNECT_PORT:-8081}:8080"
    volumes:
      - panda-connect-data:/data
    secrets:
      - bambu_access_code
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      org.opencontainers.image.title: Panda Connect local test server
      io.panda-connect.role: printer-monitor
    networks: [panda-connect]
volumes:
  panda-connect-data:
networks:
  panda-connect:
secrets:
  bambu_access_code:
    file: .secrets/access_code
